spring:
  profiles:
    active: local

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Batch job configuration
batch:
  stock-data:
    daily-load:
      enabled: true
      cron: "0 0 18 * * MON-FRI"
    quarterly-load:
      enabled: true
      cron: "0 0 19 15 1,4,7,10 *"
    backfill:
      days: 90
      auto-run-on-startup: false

# Feature flags
features:
  use-historical-data: true

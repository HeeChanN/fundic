<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 차트 - Fundic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #0b1220, #0f1b33);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 26px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(2, 6, 23, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95em;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .stock-info {
            color: #0f172a;
        }

        .stock-name {
            font-size: 1.8em;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .stock-code {
            font-size: 1em;
            color: #64748b;
            font-weight: 600;
        }

        /* 2-column layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
        }

        .chart-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 12px 30px rgba(2, 6, 23, 0.18);
        }

        .ai-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 12px 30px rgba(2, 6, 23, 0.18);
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 800;
            color: #1e40af;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 3px solid rgba(37, 99, 235, 0.18);
        }

        #tradingview-widget {
            width: 100%;
            height: 600px;
            border-radius: 10px;
            overflow: hidden;
        }

        .ai-btn {
            width: 100%;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1em;
            margin-bottom: 16px;
        }

        .ai-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.35);
        }

        .ai-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #1e40af;
            font-weight: 700;
            font-size: 1em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .analysis-result {
            color: #0f172a;
            line-height: 1.7;
        }

        .analysis-result h2 {
            font-size: 1.2em;
            color: #1e40af;
            margin-top: 20px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(37, 99, 235, 0.18);
        }

        .analysis-result h2:first-child {
            margin-top: 0;
        }

        .analysis-result ul {
            padding-left: 20px;
        }

        .analysis-result li {
            margin-bottom: 8px;
        }

        .analysis-result strong {
            color: #1e40af;
        }

        .error-box {
            background: #fef2f2;
            border: 2px solid #dc2626;
            border-radius: 10px;
            padding: 16px;
            color: #7f1d1d;
        }

        .error-box h3 {
            margin-bottom: 8px;
            color: #dc2626;
        }

        .info-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.85em;
            font-weight: 700;
            background: rgba(37, 99, 235, 0.1);
            color: #1e40af;
            margin-left: 8px;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .ai-section {
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stock-name {
                font-size: 1.4em;
            }

            #tradingview-widget {
                height: 400px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="window.close()">← 돌아가기</button>
            <div class="stock-info">
                <div class="stock-name" id="stock-name">로딩 중...</div>
                <div class="stock-code" id="stock-code-display"></div>
            </div>
        </div>
    </div>

    <!-- Main Content: 2-column layout -->
    <div class="main-content">
        <!-- Left: Chart Section -->
        <div class="chart-section">
            <div class="section-title">📈 실시간 차트</div>
            <div id="chart-container">
                <div class="loading">차트를 불러오는 중</div>
            </div>
        </div>

        <!-- Right: AI Analysis Section -->
        <div class="ai-section">
            <div class="section-title">
                🤖 AI 종목 분석
                <span class="info-badge">Google ADK</span>
            </div>

            <button class="ai-btn" id="analyze-btn" onclick="analyzeStock()">
                AI 분석 시작
            </button>

            <div id="ai-result"></div>
        </div>
    </div>
</div>

<!-- TradingView Widget Script -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<script>
    // URL에서 종목 코드와 이름 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const stockCode = urlParams.get('code');
    const stockName = urlParams.get('name') || '종목명 없음';

    // 헤더 업데이트
    document.getElementById('stock-name').textContent = stockName;
    document.getElementById('stock-code-display').textContent = `종목코드: ${stockCode || '없음'}`;

    // 차트 로드
    if (stockCode) {
        loadTradingViewChart(stockCode);
    } else {
        showChartError('종목 코드가 제공되지 않았습니다.');
    }

    function loadTradingViewChart(code) {
        // 종목 코드를 6자리로 패딩 (예: 5930 -> 005930)
        const paddedCode = code.padStart(6, '0');

        // TradingView 심볼 형식: KRX:종목코드
        const tradingViewSymbol = `KRX:${paddedCode}`;

        try {
            // 차트 컨테이너 준비
            const container = document.getElementById('chart-container');
            container.innerHTML = '<div id="tradingview-widget"></div>';

            // TradingView 위젯 생성
            new TradingView.widget({
                "width": "100%",
                "height": 600,
                "symbol": tradingViewSymbol,
                "interval": "D",
                "timezone": "Asia/Seoul",
                "theme": "light",
                "style": "1",
                "locale": "kr",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "details": true,
                "hotlist": true,
                "calendar": true,
                "studies": [
                    "RSI@tv-basicstudies",
                    "MASimple@tv-basicstudies"
                ],
                "container_id": "tradingview-widget"
            });

            console.log(`✅ TradingView 차트 로드 완료: ${tradingViewSymbol}`);
        } catch (error) {
            console.error('TradingView 차트 로드 실패:', error);
            showChartError(`차트 로드 중 오류가 발생했습니다: ${error.message}`);
        }
    }

    function showChartError(message) {
        const container = document.getElementById('chart-container');
        container.innerHTML = `
            <div class="error-box">
                <h3>⚠️ 오류</h3>
                <p>${message}</p>
            </div>
        `;
    }

    // AI 분석 실행
    async function analyzeStock() {
        if (!stockCode) {
            alert('종목 코드가 없습니다.');
            return;
        }

        const resultDiv = document.getElementById('ai-result');
        const analyzeBtn = document.getElementById('analyze-btn');

        // 버튼 비활성화 및 로딩 표시
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = 'AI 분석 중...';
        resultDiv.innerHTML = '<div class="loading">AI가 종목을 분석하고 있습니다</div>';

        try {
            const response = await fetch(`/api/ai/analyze-stock?stockCode=${stockCode}`, {
                method: 'POST'
            });

            const result = await response.json();

            if (result.success) {
                displayAnalysisResult(result.data);
            } else {
                displayError(result.message || '분석 중 오류가 발생했습니다.');
            }

        } catch (error) {
            console.error('AI 분석 오류:', error);
            displayError(`분석 요청 실패: ${error.message}`);
        } finally {
            // 버튼 재활성화
            analyzeBtn.disabled = false;
            analyzeBtn.textContent = '다시 분석';
        }
    }

    function displayAnalysisResult(data) {
        const resultDiv = document.getElementById('ai-result');

        // Markdown 스타일 텍스트를 HTML로 간단 변환
        let html = data.analysisText
            .replace(/## (.*?)(\n|$)/g, '<h2>$1</h2>')  // ## 제목
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')  // **굵게**
            .replace(/- (.*?)(\n|$)/g, '<li>$1</li>')  // - 리스트
            .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');  // 리스트 감싸기

        resultDiv.innerHTML = `
            <div class="analysis-result">
                ${html}
                <div style="margin-top: 20px; padding: 12px; background: rgba(37, 99, 235, 0.1); border-radius: 8px; font-size: 0.85em; color: #64748b;">
                    <strong>분석 기준:</strong> ${data.dataPoints}일 데이터 |
                    <strong>현재가:</strong> ${data.latestPrice.toLocaleString()}원 |
                    <strong>분석일:</strong> ${data.analyzedAt}
                </div>
            </div>
        `;
    }

    function displayError(message) {
        const resultDiv = document.getElementById('ai-result');
        resultDiv.innerHTML = `
            <div class="error-box">
                <h3>⚠️ 분석 실패</h3>
                <p>${message}</p>
                <p style="margin-top: 10px; font-size: 0.9em;">
                    <strong>해결 방법:</strong><br>
                    • 서버가 실행 중인지 확인하세요<br>
                    • 해당 종목의 데이터가 DB에 있는지 확인하세요<br>
                    • 잠시 후 다시 시도하세요
                </p>
            </div>
        `;
    }
</script>
</body>
</html>

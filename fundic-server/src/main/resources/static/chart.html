<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 투자 분석 - Fundic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #0b1220, #0f1b33);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 26px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(2, 6, 23, 0.18);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .back-btn {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95em;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .stock-info {
            color: #0f172a;
        }

        .stock-name {
            font-size: 1.8em;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .stock-code {
            font-size: 1em;
            color: #64748b;
            font-weight: 600;
        }

        .ai-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 12px 30px rgba(2, 6, 23, 0.18);
        }

        .section-title {
            font-size: 1.5em;
            font-weight: 800;
            color: #1e40af;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid rgba(37, 99, 235, 0.18);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-btn {
            width: 100%;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #fff;
            border: none;
            padding: 16px 24px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .ai-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.35);
        }

        .ai-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #1e40af;
            font-weight: 700;
            font-size: 1.1em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .analysis-result {
            color: #0f172a;
            line-height: 1.8;
            font-size: 1.05em;
        }

        .analysis-result h2 {
            font-size: 1.3em;
            color: #1e40af;
            margin-top: 24px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(37, 99, 235, 0.18);
        }

        .analysis-result h2:first-child {
            margin-top: 0;
        }

        .analysis-result h3 {
            font-size: 1.1em;
            color: #64748b;
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .analysis-result ul {
            padding-left: 24px;
            margin-bottom: 12px;
        }

        .analysis-result li {
            margin-bottom: 10px;
        }

        .analysis-result strong {
            color: #1e40af;
        }

        .error-box {
            background: #fef2f2;
            border: 2px solid #dc2626;
            border-radius: 10px;
            padding: 20px;
            color: #7f1d1d;
        }

        .error-box h3 {
            margin-bottom: 12px;
            color: #dc2626;
        }

        .info-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.75em;
            font-weight: 700;
            background: rgba(37, 99, 235, 0.1);
            color: #1e40af;
        }

        .analysis-meta {
            margin-top: 24px;
            padding: 16px;
            background: rgba(37, 99, 235, 0.08);
            border-radius: 10px;
            font-size: 0.95em;
            color: #64748b;
            border-left: 4px solid #2563eb;
        }

        .analysis-meta strong {
            color: #1e40af;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .stock-name {
                font-size: 1.4em;
            }

            .section-title {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <button class="back-btn" onclick="window.close()">← 돌아가기</button>
            <div class="stock-info">
                <div class="stock-name" id="stock-name">로딩 중...</div>
                <div class="stock-code" id="stock-code-display"></div>
            </div>
        </div>
    </div>

    <!-- AI Analysis Section -->
    <div class="ai-section">
        <div class="section-title">
            🤖 AI 투자 분석
            <span class="info-badge">Rule-based</span>
        </div>

        <button class="ai-btn" id="analyze-btn" onclick="analyzeStock()">
            📊 AI 분석 시작하기
        </button>

        <div id="ai-result"></div>
    </div>
</div>

<script>
    // URL에서 종목 코드와 이름 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const stockCode = urlParams.get('code');
    const stockName = urlParams.get('name') || '종목명 없음';

    // 헤더 업데이트
    document.getElementById('stock-name').textContent = stockName;
    document.getElementById('stock-code-display').textContent = `종목코드: ${stockCode || '없음'}`;

    // AI 분석 실행
    async function analyzeStock() {
        if (!stockCode) {
            alert('종목 코드가 없습니다.');
            return;
        }

        const resultDiv = document.getElementById('ai-result');
        const analyzeBtn = document.getElementById('analyze-btn');

        // 버튼 비활성화 및 로딩 표시
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = '🔍 AI 분석 중...';
        resultDiv.innerHTML = '<div class="loading">AI가 종목을 분석하고 있습니다</div>';

        try {
            const response = await fetch(`/api/ai/analyze-stock?stockCode=${stockCode}`, {
                method: 'POST'
            });

            const result = await response.json();

            if (result.success) {
                displayAnalysisResult(result.data);
            } else {
                displayAnalysisError(result.message || '분석 중 오류가 발생했습니다.');
            }

        } catch (error) {
            console.error('AI 분석 오류:', error);
            displayAnalysisError(`분석 요청 실패: ${error.message}`);
        } finally {
            // 버튼 재활성화
            analyzeBtn.disabled = false;
            analyzeBtn.textContent = '🔄 다시 분석하기';
        }
    }

    function displayAnalysisResult(data) {
        const resultDiv = document.getElementById('ai-result');

        // Markdown 스타일 텍스트를 HTML로 간단 변환
        let html = data.analysisText
            .replace(/## (.*?)(\n|$)/g, '<h2>$1</h2>')
            .replace(/### (.*?)(\n|$)/g, '<h3>$1</h3>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/- (.*?)(\n|$)/g, '<li>$1</li>')
            .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

        resultDiv.innerHTML = `
            <div class="analysis-result">
                ${html}
                <div class="analysis-meta">
                    <strong>📊 분석 기준:</strong> ${data.dataPoints}일 데이터 |
                    <strong>💰 현재가:</strong> ${data.latestPrice.toLocaleString()}원 |
                    <strong>📅 분석일:</strong> ${data.analyzedAt}
                </div>
            </div>
        `;
    }

    function displayAnalysisError(message) {
        const resultDiv = document.getElementById('ai-result');
        resultDiv.innerHTML = `
            <div class="error-box">
                <h3>⚠️ 분석 실패</h3>
                <p>${message}</p>
                <p style="margin-top: 12px; font-size: 0.95em;">
                    <strong>해결 방법:</strong><br>
                    • 서버가 실행 중인지 확인하세요<br>
                    • 해당 종목의 데이터가 DB에 있는지 확인하세요<br>
                    • 잠시 후 다시 시도하세요
                </p>
            </div>
        `;
    }
</script>
</body>
</html>

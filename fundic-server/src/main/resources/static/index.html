<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundic - AI 포트폴리오 추천 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group small {
            display: block;
            color: #888;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .sector-input-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .result {
            margin-top: 20px;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .result-header h3 {
            color: #667eea;
            font-size: 1.5em;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-success {
            background: #10b981;
            color: white;
        }

        .badge-error {
            background: #ef4444;
            color: white;
        }

        .result-content {
            background: #f8fafc;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
        }

        .sector-item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sector-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .sector-item.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .sector-item h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .sector-item .score {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            margin-left: 10px;
        }

        .stock-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .stock-table th,
        .stock-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .stock-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .stock-table tr:hover {
            background: #f8fafc;
        }

        .weight-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            background: #10b981;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
        }

        .market-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .market-kospi {
            background: #3b82f6;
            color: white;
        }

        .market-kosdaq {
            background: #8b5cf6;
            color: white;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.2em;
            padding: 20px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Fundic</h1>
            <p>AI 기반 포트폴리오 추천 시스템</p>
        </div>

        <div class="card">
            <h2>📊 투자 프로필 입력</h2>

            <div class="form-group">
                <label for="horizon">투자 기간</label>
                <select id="horizon">
                    <option value="W1_4">단기 (1주-4주)</option>
                    <option value="M1_6" selected>중기 (1-6개월)</option>
                    <option value="M6P">장기 (6개월 이상)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="risk">리스크 성향</label>
                <select id="risk">
                    <option value="LOW">보수적 - 안정성 우선</option>
                    <option value="MEDIUM" selected>중립 - 균형 추구</option>
                    <option value="HIGH">공격적 - 높은 수익 추구</option>
                </select>
            </div>

            <div class="form-group">
                <label for="goal">투자 목표</label>
                <select id="goal">
                    <option value="STABILITY">안정성 - 안정적인 수익</option>
                    <option value="BALANCED" selected>균형 - 안정과 성장 조화</option>
                    <option value="GROWTH">성장 - 자본 이득 극대화</option>
                    <option value="THEME">테마 - 특정 테마 투자</option>
                </select>
            </div>

            <div class="form-group">
                <label for="keywords">관심 키워드</label>
                <input type="text" id="keywords" placeholder="예: 반도체, AI, 2차전지" value="반도체, AI">
                <small>쉼표(,)로 구분하여 여러 키워드를 입력하세요</small>
            </div>

            <button class="btn-primary" onclick="recommendSectors()" style="width: 100%;">
                🎯 1단계: 섹터 추천받기
            </button>
        </div>

        <div id="sector-selection" class="card" style="display: none;">
            <h2>🎯 추천 섹터 선택</h2>
            <p style="color: #666; margin-bottom: 20px;">아래 추천 섹터를 클릭하여 선택하거나, 직접 섹터 ID를 입력하세요.</p>

            <div id="sector-cards"></div>

            <div style="margin-top: 30px;">
                <h3 style="color: #333; margin-bottom: 15px;">또는 직접 입력</h3>
                <div class="sector-input-group">
                    <div class="form-group">
                        <label for="leaderSectorId">리더 섹터 ID</label>
                        <input type="text" id="leaderSectorId" placeholder="예: 1">
                    </div>
                    <div class="form-group">
                        <label for="supportSectorId">서포트 섹터 ID</label>
                        <input type="text" id="supportSectorId" placeholder="예: 5">
                    </div>
                    <div class="form-group">
                        <label for="bufferSectorId">완충 섹터 ID</label>
                        <input type="text" id="bufferSectorId" placeholder="예: 8">
                    </div>
                </div>
            </div>

            <button class="btn-secondary" onclick="recommendPortfolio()" style="width: 100%; margin-top: 20px;">
                💼 2단계: 포트폴리오 구성하기
            </button>
        </div>

        <div id="result" class="card" style="display: none;">
            <div class="result">
                <div class="result-header">
                    <h3>📈 포트폴리오 추천 결과</h3>
                    <span id="result-badge" class="badge"></span>
                </div>
                <div id="result-content" class="result-content"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedSectors = {
            leader: null,
            support: null,
            buffer: null
        };

        let sectorRecommendations = [];

        function getUserProfile() {
            const keywords = document.getElementById('keywords').value
                .split(',')
                .map(k => k.trim())
                .filter(k => k.length > 0);

            return {
                horizon: document.getElementById('horizon').value,
                risk: document.getElementById('risk').value,
                goal: document.getElementById('goal').value,
                themeKeywords: keywords
            };
        }

        function showResult(content, isSuccess = true) {
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('result-content');
            const resultBadge = document.getElementById('result-badge');

            resultDiv.style.display = 'block';
            resultContent.innerHTML = content;

            resultBadge.className = `badge ${isSuccess ? 'badge-success' : 'badge-error'}`;
            resultBadge.textContent = isSuccess ? '✓ 성공' : '✗ 실패';

            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showLoading() {
            showResult('<div class="loading">AI가 분석 중입니다</div>', true);
        }

        async function recommendSectors() {
            showLoading();

            try {
                const profile = getUserProfile();

                const response = await fetch('/api/v1/recommend/sectors', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profile)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displaySectorSelection(data);
            } catch (error) {
                showResult(`
                    <div class="error-message">
                        <strong>오류 발생:</strong> ${error.message}<br>
                        <small>서버가 실행 중인지, Google API 키가 설정되었는지 확인해주세요.</small>
                    </div>
                `, false);
            }
        }

        function displaySectorSelection(data) {
            const sectorSelectionDiv = document.getElementById('sector-selection');
            const sectorCardsDiv = document.getElementById('sector-cards');

            if (!data.cards || data.cards.length === 0) {
                showResult('<p>추천된 섹터가 없습니다.</p>', false);
                return;
            }

            sectorRecommendations = data.cards;

            let html = '';
            data.cards.forEach((card, index) => {
                const roleLabel = card.role === 'LEADER' ? '리더' :
                                 card.role === 'SUPPORT' ? '서포트' : '완충';

                html += `
                    <div class="sector-item" onclick="selectSectorCard('${card.role.toLowerCase()}', '${card.sectorId}', '${card.sectorName}','${card.title}')">
                        <h4>
                            ${roleLabel} 섹터: ${card.title}
                            <span class="score">분야: ${card.sectorName}</span>
                        </h4>
                        <p><strong>추천 이유:</strong> ${card.oneLineReason}</p>
                    </div>
                `;
            });

            sectorCardsDiv.innerHTML = html;
            sectorSelectionDiv.style.display = 'block';

            // 자동으로 추천된 섹터 선택
            if (data.selected) {
                document.getElementById('leaderSectorId').value = data.selected.leader || '';
                document.getElementById('supportSectorId').value = data.selected.support || '';
                document.getElementById('bufferSectorId').value = data.selected.buffer || '';
            }

            sectorSelectionDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // 결과 숨기기
            document.getElementById('result').style.display = 'none';
        }

        function selectSectorCard(role, sectorId, title) {
            selectedSectors[role] = sectorId;

            // 입력 필드 업데이트
            document.getElementById(role + 'SectorId').value = sectorId;
        }

        async function recommendPortfolio() {
            const leaderSectorId = document.getElementById('leaderSectorId').value;
            const supportSectorId = document.getElementById('supportSectorId').value;
            const bufferSectorId = document.getElementById('bufferSectorId').value;

            if (!leaderSectorId || !supportSectorId || !bufferSectorId) {
                alert('섹터 ID 3개를 모두 입력해주세요!');
                return;
            }

            showLoading();

            try {
                const profile = getUserProfile();

                const requestBody = {
                    ...profile,
                    leaderSectorId: leaderSectorId,
                    supportSectorId: supportSectorId,
                    bufferSectorId: bufferSectorId
                };

                const response = await fetch('/api/v1/portfolio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayPortfolioResults(data);
            } catch (error) {
                showResult(`
                    <div class="error-message">
                        <strong>오류 발생:</strong> ${error.message}<br>
                        <small>서버가 실행 중인지, Google API 키가 설정되었는지 확인해주세요.</small>
                    </div>
                `, false);
            }
        }

        function displayPortfolioResults(data) {
            let html = '<h3 style="color: #667eea; margin-bottom: 20px;">💼 추천 포트폴리오 (Top 10 종목)</h3>';

            // 종목 리스트 (새 형식)
            if (data.stocks && data.stocks.length > 0) {
                html += `
                    <table class="stock-table">
                        <thead>
                            <tr>
                                <th>종목명</th>
                                <th>종목코드</th>
                                <th>분야</th>
                                <th>시장</th>
                                <th>비중</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.stocks.forEach(stock => {
                    const marketClass = stock.market === 'KOSPI' ? 'market-kospi' : 'market-kosdaq';

                    html += `
                        <tr>
                            <td><strong>${stock.name}</strong></td>
                            <td>${stock.code}</td>
                            <td>${stock.sectorName}</td>
                            <td><span class="market-badge ${marketClass}">${stock.market}</span></td>
                            <td><span class="weight-badge">${stock.weight.toFixed(1)}%</span></td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;
            } else {
                html += '<p>선정된 종목이 없습니다.</p>';
            }

            // 리밸런싱 룰
            if (data.rebalancingRules && data.rebalancingRules.length > 0) {
                html += `
                    <div style="margin-top: 30px; padding: 20px; background: white; border-radius: 8px; border-left: 4px solid #f59e0b;">
                        <h4 style="color: #333; margin-bottom: 15px;">⚖️ 리밸런싱 룰</h4>
                        <ul style="padding-left: 20px; color: #666;">
                            ${data.rebalancingRules.map(rule => `<li style="margin: 8px 0;">${rule}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // 주의사항
            if (data.caution) {
                html += `
                    <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 8px; border-left: 4px solid #ffc107;">
                        <h4 style="color: #856404; margin-bottom: 10px;">⚠️ 주의사항</h4>
                        <p style="color: #856404; line-height: 1.6;">${data.caution}</p>
                    </div>
                `;
            }

            showResult(html, true);
        }
    </script>
</body>
</html>

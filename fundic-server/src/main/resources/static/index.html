<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundic - AI 포트폴리오 추천 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group small {
            display: block;
            color: #888;
            margin-top: 5px;
            font-size: 0.9em;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .result {
            margin-top: 20px;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .result-header h3 {
            color: #667eea;
            font-size: 1.5em;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-success {
            background: #10b981;
            color: white;
        }

        .badge-error {
            background: #ef4444;
            color: white;
        }

        .result-content {
            background: #f8fafc;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
        }

        .sector-item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .sector-item h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .sector-item .score {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            margin-left: 10px;
        }

        .stock-list {
            margin-top: 10px;
            padding-left: 20px;
        }

        .stock-item {
            background: #f8fafc;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 3px solid #764ba2;
        }

        .stock-item .stock-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .stock-item .stock-detail {
            color: #666;
            font-size: 0.95em;
            margin: 3px 0;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.2em;
            padding: 20px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .portfolio-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .portfolio-card h4 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .weight-bar {
            background: #e0e0e0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }

        .weight-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Fundic</h1>
            <p>AI 기반 포트폴리오 추천 시스템</p>
        </div>

        <div class="card">
            <h2>📊 투자 프로필 입력</h2>

            <div class="form-group">
                <label for="horizon">투자 기간</label>
                <select id="horizon">
                    <option value="단기">단기 (1-6개월)</option>
                    <option value="중기">중기 (6개월-2년)</option>
                    <option value="장기" selected>장기 (2년 이상)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="risk">리스크 성향</label>
                <select id="risk">
                    <option value="보수">보수적 - 안정성 우선</option>
                    <option value="중립" selected>중립 - 균형 추구</option>
                    <option value="공격">공격적 - 높은 수익 추구</option>
                </select>
            </div>

            <div class="form-group">
                <label for="goal">투자 목표</label>
                <select id="goal">
                    <option value="배당" selected>배당 - 안정적인 배당 수익</option>
                    <option value="성장">성장 - 자본 이득</option>
                    <option value="균형">균형 - 배당과 성장 조화</option>
                </select>
            </div>

            <div class="form-group">
                <label for="keywords">관심 키워드</label>
                <input type="text" id="keywords" placeholder="예: 반도체, AI, 2차전지" value="반도체, AI">
                <small>쉼표(,)로 구분하여 여러 키워드를 입력하세요</small>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="recommendSectors()">
                    🎯 섹터 추천받기
                </button>
                <button class="btn-secondary" onclick="recommendPortfolio()">
                    💼 포트폴리오 구성
                </button>
            </div>
        </div>

        <div id="result" class="card" style="display: none;">
            <div class="result">
                <div class="result-header">
                    <h3>📈 추천 결과</h3>
                    <span id="result-badge" class="badge"></span>
                </div>
                <div id="result-content" class="result-content"></div>
            </div>
        </div>
    </div>

    <script>
        function getUserProfile() {
            const keywords = document.getElementById('keywords').value
                .split(',')
                .map(k => k.trim())
                .filter(k => k.length > 0);

            return {
                horizon: document.getElementById('horizon').value,
                risk: document.getElementById('risk').value,
                goal: document.getElementById('goal').value,
                themeKeywords: keywords
            };
        }

        function showResult(content, isSuccess = true) {
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('result-content');
            const resultBadge = document.getElementById('result-badge');

            resultDiv.style.display = 'block';
            resultContent.innerHTML = content;

            resultBadge.className = `badge ${isSuccess ? 'badge-success' : 'badge-error'}`;
            resultBadge.textContent = isSuccess ? '✓ 성공' : '✗ 실패';

            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showLoading() {
            showResult('<div class="loading">AI가 분석 중입니다</div>', true);
        }

        async function recommendSectors() {
            showLoading();

            try {
                const profile = getUserProfile();

                const response = await fetch('/api/v1/recommend/sectors', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profile)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displaySectorResults(data);
            } catch (error) {
                showResult(`
                    <div class="error-message">
                        <strong>오류 발생:</strong> ${error.message}<br>
                        <small>서버가 실행 중인지, Google API 키가 설정되었는지 확인해주세요.</small>
                    </div>
                `, false);
            }
        }

        async function recommendPortfolio() {
            showLoading();

            try {
                const profile = getUserProfile();

                const response = await fetch('/api/v1/portfolio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profile)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayPortfolioResults(data);
            } catch (error) {
                showResult(`
                    <div class="error-message">
                        <strong>오류 발생:</strong> ${error.message}<br>
                        <small>서버가 실행 중인지, Google API 키가 설정되었는지 확인해주세요.</small>
                    </div>
                `, false);
            }
        }

        function displaySectorResults(data) {
            let html = '<h4>🎯 추천 섹터</h4>';

            if (data.sectors && data.sectors.length > 0) {
                data.sectors.forEach((sector, index) => {
                    html += `
                        <div class="sector-item">
                            <h4>
                                ${index + 1}. ${sector.sectorName || sector.name || '알 수 없는 섹터'}
                                <span class="score">점수: ${sector.score || 'N/A'}</span>
                            </h4>
                            <p><strong>추천 이유:</strong> ${sector.reason || '정보 없음'}</p>
                        </div>
                    `;
                });
            } else {
                html += '<p>추천된 섹터가 없습니다.</p>';
            }

            if (data.explanation) {
                html += `
                    <div style="margin-top: 20px; padding: 15px; background: white; border-radius: 8px;">
                        <h4>💡 상세 분석</h4>
                        <p>${data.explanation}</p>
                    </div>
                `;
            }

            showResult(html, true);
        }

        function displayPortfolioResults(data) {
            let html = '<div class="portfolio-grid">';

            // 섹터 비중
            if (data.sectorWeights) {
                html += `
                    <div class="portfolio-card">
                        <h4>📊 섹터 비중</h4>
                        <div>
                            <strong>Leader 섹터</strong>
                            <div class="weight-bar">
                                <div class="weight-fill" style="width: ${data.sectorWeights.leader || 0}%">
                                    ${(data.sectorWeights.leader || 0).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                        <div>
                            <strong>Support 섹터</strong>
                            <div class="weight-bar">
                                <div class="weight-fill" style="width: ${data.sectorWeights.support || 0}%">
                                    ${(data.sectorWeights.support || 0).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                        <div>
                            <strong>Buffer 섹터</strong>
                            <div class="weight-bar">
                                <div class="weight-fill" style="width: ${data.sectorWeights.buffer || 0}%">
                                    ${(data.sectorWeights.buffer || 0).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 종목 배분
            if (data.stockAllocations && data.stockAllocations.length > 0) {
                html += `
                    <div class="portfolio-card">
                        <h4>📈 종목 배분</h4>
                        <div class="stock-list">
                `;

                data.stockAllocations.forEach(stock => {
                    html += `
                        <div class="stock-item">
                            <div class="stock-header">
                                [${stock.stockCode}] ${stock.stockName} (${stock.sector})
                            </div>
                            <div class="weight-bar">
                                <div class="weight-fill" style="width: ${stock.weight || 0}%">
                                    ${(stock.weight || 0).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            html += '</div>';

            // 리밸런싱 룰
            if (data.rebalancingRules && data.rebalancingRules.length > 0) {
                html += `
                    <div style="margin-top: 20px; padding: 15px; background: white; border-radius: 8px;">
                        <h4>⚖️ 리밸런싱 룰</h4>
                        <ul style="padding-left: 20px;">
                            ${data.rebalancingRules.map(rule => `<li>${rule}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // 포트폴리오 설명
            if (data.explanation) {
                html += `
                    <div style="margin-top: 20px; padding: 15px; background: white; border-radius: 8px;">
                        <h4>💡 포트폴리오 전략</h4>
                        <p>${data.explanation}</p>
                    </div>
                `;
            }

            showResult(html, true);
        }
    </script>
</body>
</html>
